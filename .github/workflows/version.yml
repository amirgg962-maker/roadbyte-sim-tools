name: Version Packages
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_notes: ${{ steps.check.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          files=$(ls release-notes/*.md 2>/dev/null | grep -v README.md | head -1)
          if [ -n "$files" ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.has_notes == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_notes == 'true'
        with:
          node-version: "24"

      - name: Install Tauri system dependencies
        if: steps.check.outputs.has_notes == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.has_notes == 'true'

      - name: Bump versions
        if: steps.check.outputs.has_notes == 'true'
        run: |
          pnpm bump
          cargo generate-lockfile

      - name: Create Version Packages PR
        if: steps.check.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION=$(grep '^version = "' apps/desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          BRANCH="release/v${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: release v${NEW_VERSION}"
          git push origin "$BRANCH" --force

          gh pr create \
            --title "Version Packages v${NEW_VERSION}" \
            --body "This PR was automatically generated. Merge it to trigger the release build." \
            --head "$BRANCH" \
            --base main || true

      - name: Wait for a manually approved GitHub Release
        if: steps.check.outputs.has_notes == 'false'
        run: echo "No release notes to version. Create a GitHub Release manually when the version is ready; the v* tag will start the signed bundle workflow."
